name: Refresh profile activity

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_activity.py
      - scripts/test_update_activity.py
      - .github/workflows/update-activity.yml

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check dashboard generator
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Generate public contribution dashboard
        run: python3 scripts/update_activity.py
      - name: Save refreshed dashboard
        run: |
          if ! git diff --quiet -- assets/activity.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/activity.svg
            git commit -m "Refresh public contribution dashboard" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
          fi
